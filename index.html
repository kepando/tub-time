<html lang="en">
<head>

<style>
:root{
  --bg:#f3f6f9; --card:#ffffff; --ink:#15242e; --muted:#5b6b78; --line:#e2e9ef;
  --brand:#1B87BF; --brand-ink:#0d5c86; --accent:#FFC21E;
  --good:#1f9d57; --warn:#e0a106; --bad:#d64545; --good-bg:#e4f6ec; --warn-bg:#fcf3dc; --bad-bg:#fbe6e6;
  --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
  --shadow:0 1px 3px rgba(16,40,60,.08),0 1px 2px rgba(16,40,60,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1620; --card:#15242e; --ink:#eaf1f6; --muted:#9db0bd; --line:#24384a;
    --brand:#3fb0e6; --brand-ink:#8fd3f3; --accent:#FFC21E;
    --good:#49c27e; --warn:#e8bc4a; --bad:#f07070; --good-bg:#12331f; --warn-bg:#33290c; --bad-bg:#3a1414;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.4;
  overscroll-behavior-y:contain;}
button{font-family:inherit; cursor:pointer}
a{color:var(--brand)}
h1,h2,h3{margin:0 0 .4em}
h2{font-size:1.15rem} h3{font-size:1rem}
small{color:var(--muted)}
.hidden{display:none !important}

/* Solid header that fully covers the iOS status-bar strip (black-translucent). */
header.app{position:sticky; top:0; z-index:30; background:var(--card); border-bottom:1px solid var(--line);
  padding:calc(var(--safe-top) + 12px) 16px 12px; display:flex; align-items:center; gap:10px;
  box-shadow:0 2px 12px rgba(0,0,0,.18);}
header.app img{width:30px; height:30px}
header.app .title{font-weight:700; font-size:1.1rem; letter-spacing:.2px}
header.app .spacer{flex:1}

main{max-width:720px; margin:0 auto; padding:14px 14px calc(var(--safe-bottom) + 108px); min-height:60vh}

/* Floating-pill bottom nav, offset above the home indicator. */
nav.tabs{position:fixed; left:12px; right:12px; bottom:calc(var(--safe-bottom) + 12px); z-index:30;
  max-width:500px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:22px;
  display:flex; padding:8px 4px; box-shadow:0 10px 30px rgba(0,0,0,.32);}
nav.tabs button{flex:1; background:none; border:none; color:var(--muted); padding:6px 2px; font-size:.66rem; font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:4px}
nav.tabs button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; display:block}
nav.tabs button.active{color:var(--brand)}

/* Pull-to-refresh indicator */
#ptr{position:fixed; left:0; right:0; top:calc(var(--safe-top) + 58px); display:flex; justify-content:center; z-index:25; pointer-events:none; opacity:0; transition:opacity .15s}
#ptr .ring{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 14px; box-shadow:var(--shadow); color:var(--muted); font-size:.82rem; font-weight:600}

/* Swipe-to-delete rows */
.swipe{position:relative; overflow:hidden; border-top:1px solid var(--line)}
.swipe:first-child{border-top:none}
.swipe .swipe-del{position:absolute; top:0; right:0; bottom:0; width:92px; border:none; background:var(--bad); color:#fff; font-weight:700; font-size:.95rem}
.swipe .swipe-fg{position:relative; background:var(--card); transform:translateX(0); will-change:transform; touch-action:pan-y}

.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow)}
.card.tight{padding:12px 14px}
.row{display:flex; align-items:center; gap:10px}
.row.between{justify-content:space-between}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stack>*+*{margin-top:10px}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:none; border-radius:12px;
  background:var(--brand); color:#fff; font-weight:600; font-size:1rem; padding:13px 16px; width:100%;}
.btn.sm{padding:9px 13px; font-size:.9rem; width:auto}
.btn.ghost{background:transparent; color:var(--brand); border:1px solid var(--brand)}
.btn.sub{background:var(--line); color:var(--ink)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.5}
.btn.big{padding:18px; font-size:1.1rem}

label.fld{display:block; font-size:.85rem; color:var(--muted); margin-bottom:5px}
input,select,textarea{width:100%; min-width:0; max-width:100%; padding:12px; border:1px solid var(--line); border-radius:11px; background:var(--bg);
  color:var(--ink); font-size:1rem; font-family:inherit; box-sizing:border-box}
input[type="datetime-local"],input[type="date"],input[type="time"]{font-size:.95rem; text-align:left; -webkit-appearance:none; appearance:none}
textarea{min-height:96px; resize:vertical}

.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:.78rem; font-weight:600}
.pill.good{background:var(--good-bg); color:var(--good)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.bad{background:var(--bad-bg); color:var(--bad)}
.pill.neutral{background:var(--line); color:var(--muted)}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:999px; padding:9px 14px; font-size:.95rem; min-width:46px; text-align:center}
.chip.on{background:var(--brand); color:#fff; border-color:var(--brand)}
.chip.range{border-style:dashed}

.statusbar{height:6px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:6px}
.banner{border-radius:14px; padding:13px 15px; font-weight:600; margin-bottom:14px; display:flex; gap:10px; align-items:center}
.banner.due{background:var(--warn-bg); color:var(--warn)}

.listrow{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line)}
.listrow:first-child{border-top:none}
.muted{color:var(--muted)}
.kv{display:flex; justify-content:space-between; gap:10px; padding:3px 0}
.kv b{font-weight:600}

.step{border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; background:var(--card)}
.step.done{opacity:.6}
.step.active{border-color:var(--brand); box-shadow:0 0 0 2px rgba(27,135,191,.15)}
.step .num{display:inline-flex; width:26px; height:26px; border-radius:50%; background:var(--brand); color:#fff; align-items:center; justify-content:center; font-size:.85rem; font-weight:700; flex:none}
.why{font-size:.88rem; color:var(--muted); margin-top:6px}
.timer{font-variant-numeric:tabular-nums; font-weight:700; font-size:1.3rem}

.toast{position:fixed; left:50%; bottom:calc(var(--safe-bottom) + 92px); transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:11px 16px; border-radius:12px; font-size:.9rem; z-index:50; max-width:90%; text-align:center; box-shadow:var(--shadow)}
.center{text-align:center}
.empty{text-align:center; color:var(--muted); padding:30px 10px}
.empty img{width:72px; opacity:.85; margin-bottom:10px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--bad-bg); color:var(--bad); border-radius:12px; padding:11px 14px; font-size:.9rem; margin:10px 0}
.hint{font-size:.82rem; color:var(--muted)}
pre.raw{white-space:pre-wrap; background:var(--bg); padding:12px; border-radius:10px; font-size:.82rem; overflow:auto}
.flaglist li{margin:3px 0}
.syncchip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:600}
.syncchip .dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.syncchip .dot.pending{background:var(--warn)}
.syncchip .dot.err{background:var(--bad)}
</style>

<body>

<!-- Sign-in gate -->
<div id="gate" class="hidden" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center">
  <img src="duck.svg" width="96" height="96" alt="">
  <h1 style="margin:14px 0 4px">Tub Time</h1>
  <p class="muted" style="max-width:300px">Hot tub treatment & maintenance, remembered for you.</p>
  <button id="signinBtn" class="btn" style="max-width:280px;margin-top:18px">Sign in with Microsoft</button>
  <div id="gateErr" class="err hidden" style="max-width:320px"></div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header class="app">
    <img src="duck.svg" alt="">
    <span class="title">Tub Time</span>
    <span class="spacer"></span>
    <span id="sync" class="syncchip"><span class="dot"></span><span class="t">Saved</span></span>
  </header>
  <div id="ptr"><div class="ring">Pull to refresh</div></div>
  <main id="view"></main>
  <nav class="tabs">
    <button data-route="dashboard" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>Home</button>
    <button data-route="test"><svg viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg>Test</button>
    <button data-route="soak"><svg viewBox="0 0 24 24"><path d="M8 4c-1 1.2-1 2.3 0 3.5S9 9.8 8 11"/><path d="M12 4c-1 1.2-1 2.3 0 3.5S13 9.8 12 11"/><path d="M16 4c-1 1.2-1 2.3 0 3.5S17 9.8 16 11"/><path d="M4 15h16v2a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/></svg>Soak</button>
    <button data-route="log"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>Log</button>
    <button data-route="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>More</button>
  </nav>
</div>

<script>
/* ============================================================
   Tub Time — Phase 1
   Stack: vanilla JS PWA, MSAL.js auth, OneDrive (Graph) storage,
   Claude (browser-direct, key held in OneDrive settings.json).
   ============================================================ */

const CONFIG = {
  MSAL_CLIENT_ID: '832dfba8-a554-4df1-8a20-425ec01e8019',  // Tub Time Entra app registration (client) ID
  AUTHORITY: 'https://login.microsoftonline.com/consumers',
  SCOPES: ['User.Read', 'Files.ReadWrite'],        // Calendars.ReadWrite added in Phase 2
  GRAPH: 'https://graph.microsoft.com/v1.0',
  BASE_PATH: '/zApplications/TubTime',             // all app data lives here; never the OneDrive root
  CLAUDE_API: 'https://api.anthropic.com/v1/messages',
  CLAUDE_MODEL: 'claude-opus-4-8',                 // supports image input (Phase 2 label photos)
  ANTHROPIC_VERSION: '2023-06-01',
};

/* ---------- small helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
const el = (tag, props={}, kids=[]) => {
  const n = document.createElement(tag);
  for (const k in props){ if(k==='class') n.className=props[k]; else if(k==='html') n.innerHTML=props[k]; else if(k.startsWith('on')) n.addEventListener(k.slice(2),props[k]); else if(props[k]!=null) n.setAttribute(k,props[k]); }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>{ if(c==null) return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
};
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2,7));
const nowISO = () => new Date().toISOString();
const fmtDate = (iso) => { if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); };
const daysSince = (iso) => iso ? Math.floor((Date.now()-new Date(iso))/86400000) : null;
const hoursSince = (iso) => iso ? Math.floor((Date.now()-new Date(iso))/3600000) : null;
function toast(msg){ const t=el('div',{class:'toast'},msg); document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function agoText(iso){ if(!iso) return 'never'; const d=daysSince(iso); if(d===0){const h=hoursSince(iso); return h<=0?'just now':h+'h ago';} return d+'d ago'; }

/* ============================================================
   AUTH (MSAL)
   ============================================================ */
let msalApp=null, account=null;
function initMsal(){
  msalApp = new msal.PublicClientApplication({
    auth:{ clientId:CONFIG.MSAL_CLIENT_ID, authority:CONFIG.AUTHORITY, redirectUri:location.origin+location.pathname },
    cache:{ cacheLocation:'localStorage', storeAuthStateInCookie:false }
  });
}
async function restoreAccount(){ const a=msalApp.getAllAccounts(); if(a.length){ account=a[0]; return true; } return false; }
async function signIn(){
  // loginPopup works in iOS Safari and installed PWA; loginRedirect breaks standalone PWAs.
  const r = await msalApp.loginPopup({ scopes:CONFIG.SCOPES });
  account = r.account; msalApp.setActiveAccount(account);
}
async function getToken(){
  try{ const r=await msalApp.acquireTokenSilent({ scopes:CONFIG.SCOPES, account }); return r.accessToken; }
  catch(e){ const r=await msalApp.acquireTokenPopup({ scopes:CONFIG.SCOPES }); account=r.account; return r.accessToken; }
}
function signOut(){ msalApp.logoutPopup({ account }).catch(()=>{}); localStorage.removeItem('tt_mirror'); }

/* ============================================================
   GRAPH / ONEDRIVE STORAGE
   Path-based addressing, eTag conflict handling, local mirror,
   and a retry queue so a failed save never loses a log entry.
   ============================================================ */
const itemPath = (name) => `${CONFIG.GRAPH}/me/drive/root:${CONFIG.BASE_PATH}/${name}`;
const contentUrl = (name) => itemPath(name)+':/content';

async function graph(url, opts={}){
  const token = await getToken();
  const headers = Object.assign({ Authorization:'Bearer '+token }, opts.headers||{});
  const res = await fetch(url, Object.assign({}, opts, { headers }));
  return res;
}
async function ensureFolders(){
  // Create TubTime (and knowledge/) if missing. /zApplications already exists.
  async function mkdir(parentPath, name){
    const res = await graph(`${CONFIG.GRAPH}/me/drive/root:${parentPath}:/children`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, folder:{}, '@microsoft.graph.conflictBehavior':'fail' })
    });
    if(!res.ok && res.status!==409){ /* 409 = already exists, fine */ const t=await res.text(); console.warn('mkdir',name,res.status,t); }
  }
  await mkdir('/zApplications','TubTime');
  await mkdir(CONFIG.BASE_PATH,'knowledge');
}
const etags = {};
async function readFile(name){
  // metadata first (for eTag), then content
  const meta = await graph(itemPath(name));
  if(meta.status===404) return { missing:true };
  if(!meta.ok) throw new Error('read meta '+name+' → '+meta.status);
  const m = await meta.json(); etags[name]=m.eTag;
  const c = await graph(contentUrl(name));
  if(!c.ok) throw new Error('read content '+name+' → '+c.status);
  return { text: await c.text() };
}
async function writeFile(name, text){
  const doPut = async (etag) => graph(contentUrl(name), {
    method:'PUT',
    headers: Object.assign({'Content-Type':'application/octet-stream'}, etag?{'If-Match':etag}:{}),
    body: text
  });
  let res = await doPut(etags[name]);
  if(res.status===412){ // conflict → refresh eTag and retry once
    const meta = await graph(itemPath(name)); if(meta.ok){ etags[name]=(await meta.json()).eTag; }
    res = await doPut(etags[name]);
  }
  if(!res.ok) throw new Error('write '+name+' → '+res.status);
  const item = await res.json(); etags[name]=item.eTag;
  return true;
}

/* ---- local mirror + write queue ---- */
function mirrorLoad(){ try{ return JSON.parse(localStorage.getItem('tt_mirror')||'{}'); }catch(e){ return {}; } }
function mirrorSave(obj){ localStorage.setItem('tt_mirror', JSON.stringify(obj)); }
let queue = {};            // name -> text pending upload
try{ queue = JSON.parse(localStorage.getItem('tt_queue')||'{}'); }catch(e){ queue={}; }
const persistQueue = () => localStorage.setItem('tt_queue', JSON.stringify(queue));
let flushing=false;
function setSync(state){ const c=$('#sync'); if(!c) return; const dot=c.querySelector('.dot'), t=c.querySelector('.t');
  dot.className='dot'+(state==='pending'?' pending':state==='err'?' err':'');
  t.textContent = state==='pending'?'Saving…':state==='err'?'Retry':'Saved'; }

async function flushQueue(){
  if(flushing) return; const names=Object.keys(queue); if(!names.length){ setSync('ok'); return; }
  flushing=true; setSync('pending');
  for(const name of names){
    try{ await writeFile(name, queue[name]); delete queue[name]; persistQueue(); }
    catch(e){ console.warn('flush failed',name,e); setSync('err'); flushing=false; setTimeout(flushQueue,15000); return; }
  }
  flushing=false; setSync('ok');
}
window.addEventListener('online', flushQueue);
setInterval(flushQueue, 30000);

/* ============================================================
   STATE / COLLECTIONS
   ============================================================ */
const FILES = {
  settings:'settings.json', products:'products.json', tests:'tests.json',
  soaks:'soaks.json', maintenance:'maintenance.json', events:'events.json',
  rules:'knowledge/rules.md'
};
const state = { settings:null, products:null, tests:null, soaks:null, maintenance:null, events:null, rules:'' };

function queueSave(key){
  const name = FILES[key];
  const text = key==='rules' ? state.rules : JSON.stringify(state[key], null, 2);
  queue[name] = text; persistQueue();
  const mir = mirrorLoad(); mir[key] = key==='rules'?state.rules:state[key]; mirrorSave(mir);
  setSync('pending');
  clearTimeout(queueSave._t); queueSave._t=setTimeout(flushQueue, 1200);
}

/* ---- seed defaults ---- */
const DEFAULT_RULES = `# Hot Tub Chemistry Rules (Ken's tub)

## Sequencing
- Alkalinity before everything. In any correction or rescue, fix alkalinity first; it's the foundation that makes other corrections hold.
- Calcium before shock when both are needed, so shock doesn't bleach the hardness pad mid-adjustment.
- Defoamer goes last, after shock has circulated, at roughly HALF the label dose (full doses add to TDS buildup).
- Small, conservative doses with a retest between passes. Never one large correction.

## Sanitizer & shock
- Shock is soak-triggered, not calendar-based. A fixed weekly shock plus routine pH Down use wore down alkalinity and caused repeated crashes (alkalinity bottoms out → pH drops → bromine zeros).
- After a soak, especially multiple people or long soaks, shock to bring bromine back. Tablets alone can't keep up with heavy bather load.
- Don't rely on a last-minute shock to make a soak possible. Keep bromine topped up with tablets; shock when the water can recover before the next soak.
- Tablets dissolve only with water flow. The filter compartment (in the pump path) is more reliable than the floater.
- Split tablets between the filter compartment and floater. Concentrating acidic tablets in one spot during pump-off periods can slowly corrode the heater and metal fittings.
- Floater vent dial doesn't hold its position; check it when bromine runs low.
- No soaking until bromine is 3–5 ppm. Above ~5 (e.g., 10+), it's harsh on skin and eyes: let it come down before soaking.

## pH & alkalinity
- pH Down only when pH is above ~7.8.
- Alkalinity Up raises pH along with it; after adding it, don't add pH Up until you've retested.
- If alkalinity and pH are in range, say "leave them alone." Don't make unnecessary adjustments.

## Test strip quirks
- High sanitizer bleaches the alkalinity and hardness pads, giving false-LOW readings. pH reads accurately even when sanitizer is high.
- A sudden large drop (e.g., alkalinity 120 → 0 after a small shock) isn't chemically possible. Treat it as a bleached-pad artifact; don't dose against it.
- The best time to trust a hardness reading is when bromine is near 0.
- The hardness pad drifts after 30 seconds; only the 30-second read is reliable.
- Test procedure: run jets on high 15–20 min, read at 30 seconds, in good light. Low or evening light causes misreads.

## Foam & water age
- Persistent foam comes from low calcium hardness and/or aging water with high TDS. Chemicals can only do so much; sometimes a drain is the right answer. Say so directly when it is.

## Enzyme clarifier ("natural enzymes")
- Part of the routine, not a rescue product. Enzymes break down non-living organics (body oils, lotions, sweat, deodorant residue) so the sanitizer and filter can clear them. That means less foam, less scum line, and lower bromine demand after soaks.
- Dose: small and weekly, per the label, scaled to 305 gal (use the active enzyme product's data).
- Timing: add it when bromine is in the normal 3–5 range. NOT right after shocking, because fresh shock weakens the enzymes. If a shock is due, shock first and schedule the enzyme dose for a later session once bromine has settled. Never put enzymes and shock in the same session.
- Enzymes don't sanitize. They never replace shock or tablets.
- For foam, prefer enzymes (removes the cause) over defoamer (only knocks bubbles down). Defoamer is still fine at half dose for immediate knockdown.
- If enzyme dosing is overdue and the water is foaming or bromine demand is high, mention it in the plan.

## Maintenance
- Drain/refill quarterly (sooner if foam becomes unmanageable).
`;

function defaultSettings(){
  return {
    schemaVersion:1,
    tub:{ model:'LifeSmart Leganza', persons:6, gallons:305, sanitizer:'bromine',
      tablets:'2 in filter compartment (primary) + 2–3 in floating dispenser (supplement)',
      filterCyclesHoursPerDay:4, idleTempF:'98–100', location:'Portland, OR', fillWater:'very soft' },
    targets:{
      alkalinity:{target:100, min:80, max:120, unit:'ppm'},
      ph:{target:7.5, min:7.4, max:7.6, unit:''},
      hardness:{target:150, min:150, max:250, unit:'ppm'},
      bromine:{target:4, min:3, max:5, unit:'ppm'}
    },
    typicalFreshFill:{ hardness:'0–25', alkalinity:'0–40', ph:'6.8–7.2', bromine:0 },
    maintenanceIntervals:{ enzymeDays:7, drainDays:90, filterRinseDays:14, filterReplaceDays:365 },
    schedulingWindows:{ weekdayStartTime:'19:30', weekendStart:'12:00', weekendEnd:'15:00' },
    excludedCalendars:[],
    apiKey:''

async function loadAll(){

  for(const key of ['settings','products','tests','soaks','maintenance','events']){

    if(f.missing){ state[key]=defaults[key](); await writeFile(FILES[key], JSON.stringify(state[key],null,2)); }
    else { try{ state[key]=JSON.parse(f.text); }catch(e){ state[key]=defaults[key](); } }

const sortedTests = () => [...state.tests.items].sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));

const lastTest = () => sortedTests()[0] || null;
const lastSoak = () => sortedSoaks()[0] || null;
function lastTreatment(){ // most recent test session that recorded completed dosing steps
  for(const t of sortedTests()){ if((t.completedSteps||[]).some(s=>s.status==='done' && s.action)) return t; }

}
function lastDrain(){ const d=[...state.maintenance.items].filter(m=>m.type==='drain-refill').sort((a,b)=>new Date(b.date)-new Date(a.date)); return d[0]||null; }
function lastMaint(type){ const d=[...state.maintenance.items].filter(m=>m.type===type).sort((a,b)=>new Date(b.date)-new Date(a.date)); return d[0]||null; }
function soaksSince(iso){ const since=iso?new Date(iso):new Date(0); return sortedSoaks().filter(s=> new Date(s.datetime)>since); }

function buildSystemPrompt(){
  const s=state.settings, t=s.targets;
  return state.rules + `

## Tub profile
Model: ${s.tub.model} — ${s.tub.persons}-person, ~${s.tub.gallons} gallons. Sanitizer: ${s.tub.sanitizer}.
Tablets: ${s.tub.tablets}. Filter cycles: ~${s.tub.filterCyclesHoursPerDay} hrs/day. Idle temp: ${s.tub.idleTempF}°F. Location: ${s.tub.location}; fill water ${s.tub.fillWater}.
Measuring tools: teaspoons and cups only — every dose must be in tsp/cup (or tablets). No tablespoons or fluid ounces.

## Targets
Alkalinity ~${t.alkalinity.target} ppm (band ${t.alkalinity.min}–${t.alkalinity.max}). pH ${t.ph.min}–${t.ph.max}. Hardness ~${t.hardness.target} ppm (${t.hardness.min}–${t.hardness.max} acceptable). Bromine ${t.bromine.min}–${t.bromine.max} ppm.

You are Ken's hot tub assistant. Open with the single priority, give numbered steps in order (alkalinity first when needed), each with the exact dose in tsp/cup/tablet for ${s.tub.gallons} gal, the product, jets, lid, and circulation time, plus a short "why". Flag strip artifacts before dosing against suspicious numbers. Give a "leave alone" line for in-range parameters and a clear soak-readiness call. Be honest, including when the answer is "drain it".

Respond with ONLY a JSON object (no markdown fences, no prose) matching exactly this shape:
{"summary":"","soak_ready":"yes|after_steps|no","soak_ready_note":"","flags":[],"leave_alone":[],
 "steps":[{"order":1,"action":"","product_id":null,"amount":0,"unit":"cup|tsp|tablet|none","jets":"high|low|off","lid":"open|closed|n/a","wait_minutes":0,"retest_after":false,"retest_focus":[],"conditional":null,"why":""}],
 "going_forward":null,
 "followups":[{"type":"retest|shock|treatment","due_in_hours":4,"estimated_minutes":10,"note":""}]}`;
}
function buildUserContent(session){
  const s=state.settings, strip=activeStrip();
  const readings = session.readings.map(r=>`${r.name}: ${r.value}${r.unit?(' '+r.unit):''}`).join('; ');
  const lt = lastTest();
  const recent = sortedTests().slice(0,5).map(t=>{
    const rd=(t.readings||[]).map(r=>`${r.name} ${r.value}`).join(', ');
    const did=(t.completedSteps||[]).filter(x=>x.status==='done').map(x=>`${x.action}${x.amount?(' '+x.amount+(x.unit||'')):''}`).join('; ') || 'nothing recorded';
    return `• ${fmtDate(t.timestamp)} — readings: ${rd}. Did: ${did}.${t.retest?(' Retest: '+(t.retest.readings||[]).map(r=>r.name+' '+r.value).join(', ')):''}`;
  }).join('\n') || 'none';
  const ltreat=lastTreatment();
  const since = soaksSince(ltreat?ltreat.timestamp:null);
  const people = since.reduce((a,x)=>a+(+x.people||0),0);
  const minutes = since.reduce((a,x)=>a+(+x.durationMin||0),0);
  const drain=lastDrain();
  const prods = activeProducts().filter(p=>!p.stripProfile).map(p=>`- ${p.category}: ${p.brand} ${p.name}${p.activeIngredient?(' ('+p.activeIngredient+')'):''}${p.doseConverted?(' — dose: '+p.doseConverted):''}`).join('\n');
  return `Current readings (in strip order${strip?', '+strip.name:''}), taken ${fmtDate(session.timestamp)}:
${readings}
Time since last test: ${lt?agoText(lt.timestamp):'n/a (first test)'}.

Last ~5 sessions:
${recent}

Soaks since last treatment: ${since.length} soak(s), ${people} total people, ${minutes} total minutes. Most recent soak: ${lastSoak()?agoText(lastSoak().datetime):'none logged'}.
Water age: ${drain?daysSince(drain.date)+' days since refill':'unknown (no refill logged)'}.
Last filter rinse: ${lastMaint('filter-rinse')?agoText(lastMaint('filter-rinse').date):'none logged'}. Last filter replacement: ${lastMaint('filter-replace')?agoText(lastMaint('filter-replace').date):'none logged'}. Last enzyme dose: ${lastMaint('enzyme')?agoText(lastMaint('enzyme').date):'none logged'}.

Active products (pre-converted for ${s.tub.gallons} gal):
${prods}

My notes: ${session.notes||'(none)'}${session.planToSoak&&session.planToSoak.planning?`\nPlanning to soak: ${session.planToSoak.when||'soon'}, ${session.planToSoak.people||'?'} people.`:''}

What treatments should I administer and in which order?`;
}
function extractJson(text){
  let t=text.trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(fence) t=fence[1].trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a>=0&&b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}
function validatePlan(p){
  return p && typeof p.summary==='string' && Array.isArray(p.steps) && typeof p.soak_ready==='string';
}
async function callClaude(messages, extraSystem){
  const key=(state.settings.apiKey||'').trim();
  if(!key) throw new Error('NO_KEY');
  const res = await fetch(CONFIG.CLAUDE_API, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':CONFIG.ANTHROPIC_VERSION, 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model:CONFIG.CLAUDE_MODEL, max_tokens:2048, system:(extraSystem||buildSystemPrompt()), messages })
  });
  if(!res.ok){ const t=await res.text(); throw new Error('Claude '+res.status+': '+t.slice(0,300)); }
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
async function generatePlan(session, priorMessages){
  const messages = priorMessages || [{ role:'user', content: buildUserContent(session) }];
  let raw = await callClaude(messages);
  try{ const p=extractJson(raw); if(validatePlan(p)) return { plan:p, messages:[...messages,{role:'assistant',content:raw}] }; }catch(e){}
  // retry once
  const retryMsgs=[...messages,{role:'assistant',content:raw},{role:'user',content:'That was not valid. Respond with ONLY the JSON object described, nothing else.'}];
  raw = await callClaude(retryMsgs);
  try{ const p=extractJson(raw); if(validatePlan(p)) return { plan:p, messages:[...retryMsgs,{role:'assistant',content:raw}] }; }catch(e){}
  return { raw, messages:[...retryMsgs,{role:'assistant',content:raw}] };
}

/* ============================================================
   READING EVALUATION (color coding vs targets)
   ============================================================ */
function evalReading(name, value){
  const n=name.toLowerCase(); const v=parseFloat(String(value).split('–')[0]);
  const t=state.settings.targets; let band=null;
  if(n.includes('alkalin')) band=t.alkalinity; else if(n==='ph'||n.includes('ph')) band=t.ph;
  else if(n.includes('hard')) band=t.hardness; else if(n.includes('bromine')) band=t.bromine;
  if(!band || isNaN(v)) return 'neutral';
  if(v<band.min || v>band.max) return (v<band.min*0.5||v>band.max*1.5)?'bad':'warn';
  return 'good';
}

function inDays(n){ if(n==null) return '—'; if(n<=0) return 'now / overdue'; return `in ${n} day${n===1?'':'s'}`; }
function upcomingItems(){

views.test = (v) => {
  const strip=activeStrip();
  if(!strip){ v.appendChild(emptyState('No test strip profile yet','Add a test-strip product in Products to build the test form.')); return; }
  const session = { id:uid(), timestamp:nowISO(), stripProfileId:strip.id, readings:[], notes:'', planToSoak:{planning:false} };

  v.appendChild(el('div',{class:'card tight'},[ el('small',{html:'🔆 <b>Before testing:</b> run jets on high 15–20 min, read at 30 seconds, in good light.'}) ]));

  const form=el('div',{class:'card stack'});
  strip.stripProfile.pads.forEach((pad,i)=>{
    session.readings.push({ name:pad.name, unit:pad.unit, value:null });
    const chips=el('div',{class:'chips'});
    const selected={idx:[]};
    pad.chart.forEach((val,ci)=>{
      const chip=el('button',{class:'chip', type:'button'}, String(val));
      chip.addEventListener('click', ()=>{
        // tap once = value; tap a second chip = range "a–b"
        if(selected.idx.length===1 && selected.idx[0]!==ci){
          selected.idx.push(ci); selected.idx.sort((a,b)=>a-b);
          const a=pad.chart[selected.idx[0]], b=pad.chart[selected.idx[1]];
          session.readings[i].value = a+'–'+b;
        } else {
          selected.idx=[ci]; session.readings[i].value = String(val);
        }
        [...chips.children].forEach((c,ci2)=> c.classList.toggle('on', selected.idx.includes(ci2)));
        [...chips.children].forEach((c,ci2)=> c.classList.toggle('range', selected.idx.length===2 && selected.idx.includes(ci2)));
      });
      chips.appendChild(chip);
    });
    form.appendChild(el('div',{},[ el('label',{class:'fld'}, pad.name+(pad.unit?(' ('+pad.unit+')'):'')), chips ]));
  });
  v.appendChild(form);

  const notes=el('textarea',{placeholder:'Notes (optional)'});
  const planChk=el('input',{type:'checkbox'});
  const planWhen=el('input',{type:'text', placeholder:'When? e.g. tonight', class:'hidden'});
  const planPeople=el('input',{type:'number', placeholder:'How many people?', class:'hidden', min:'1'});
  planChk.addEventListener('change',()=>{ planWhen.classList.toggle('hidden',!planChk.checked); planPeople.classList.toggle('hidden',!planChk.checked); });
  v.appendChild(el('div',{class:'card stack'},[
    el('div',{},[ el('label',{class:'fld'},'Notes'), notes ]),
    el('label',{class:'row', style:'gap:8px'},[ planChk, el('span',{},'Planning to soak?') ]),
    planWhen, planPeople
  ]));

  const err=el('div',{class:'err hidden'});
  const btn=el('button',{class:'btn'},'Get treatment plan');
  btn.addEventListener('click', async ()=>{
    if(session.readings.every(r=>r.value==null)){ err.textContent='Enter at least one reading.'; err.classList.remove('hidden'); return; }
    session.readings = session.readings.filter(r=>r.value!=null);
    session.notes = notes.value.trim();
    session.planToSoak = { planning:planChk.checked, when:planWhen.value.trim(), people:planPeople.value };
    if(!(state.settings.apiKey||'').trim()){ err.innerHTML='No Anthropic API key set. Add it in <a href="#" onclick="go(\'settings\');return false">Settings</a>.'; err.classList.remove('hidden'); return; }
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> Generating plan…'; err.classList.add('hidden');
    try{
      const result = await generatePlan(session);

      session.completedSteps = [];

      err.textContent = e.message==='NO_KEY' ? 'No API key set.' : ('Plan failed: '+e.message); err.classList.remove('hidden');

    } else {

      ctr.appendChild(el('button',{class:'btn sm', onclick:()=>{ t.completedSteps.push({order:s.order, action:s.action, amount:s.amount, unit:s.unit, status:'done'}); queueSave('tests'); go('session',t.id); }},'✓ Done'));
      if(s.amount && s.unit && s.unit!=='none'){
        ctr.appendChild(el('button',{class:'btn sm sub', onclick:()=>{
          const val=prompt('Amount you actually used ('+s.unit+'):', s.amount); if(val==null) return;
          t.completedSteps.push({order:s.order, action:s.action, amount:parseFloat(val), unit:s.unit, status:'done'}); queueSave('tests'); go('session',t.id);
        }},'Edit amount'));
      }
      ctr.appendChild(el('button',{class:'btn sm sub', onclick:()=>{
        const reason=prompt('Skip reason:','') ; if(reason==null) return;
        t.completedSteps.push({order:s.order, action:s.action, status:'skipped', reason}); queueSave('tests'); go('session',t.id);
      }},'Skip'));
      node.appendChild(ctr);

      if(s.wait_minutes){ node.appendChild(timerNode(t, s)); }
      if(s.retest_after){ node.appendChild(el('button',{class:'btn sm ghost', style:'margin-top:10px', onclick:()=> retestFlow(t, s)},'↻ Retest now'+(s.retest_focus&&s.retest_focus.length?(' ('+s.retest_focus.join(', ')+')'):''))); }
    }
    stepsWrap.appendChild(node);
  });
  v.appendChild(el('div',{class:'card'},[ el('h3',{},'Steps'), stepsWrap ]));

  if(p.going_forward) v.appendChild(el('div',{class:'card tight'},[ el('small',{html:'📌 <b>Going forward:</b> '+p.going_forward}) ]));

  if(t.retest){
    v.appendChild(el('div',{class:'card'},[ el('h3',{},'Retest'), el('div',{class:'chips'}, (t.retest.readings||[]).map(r=>el('span',{class:'pill '+evalReading(r.name,r.value)}, r.name+': '+r.value))),
      t.retest.plan? el('p',{style:'margin-top:8px'}, t.retest.plan.summary) : (t.retest.raw?el('pre',{class:'raw'},t.retest.raw):null) ]));
  }

  const allHandled = (p.steps||[]).length && (p.steps||[]).every(s=> t.completedSteps.find(c=>c.order===s.order));
  v.appendChild(el('button',{class:'btn '+(allHandled?'':'sub'), onclick:()=>{ toast('Session saved'); go('dashboard'); }}, allHandled?'Finish & save session':'Save for later'));
};

function timerNode(t, s){
  const key='t_'+t.id+'_'+s.order;
  const wrap=el('div',{class:'card tight', style:'margin-top:10px;background:var(--bg)'});
  const end = t['timerEnd_'+s.order];
  const line=el('div',{class:'row between'});
  const disp=el('span',{class:'timer'},'');
  line.appendChild(disp);
  if(!end){
    const start=el('button',{class:'btn sm', onclick:()=>{ t['timerEnd_'+s.order]=Date.now()+s.wait_minutes*60000; queueSave('tests'); go('session',t.id); }}, 'Start '+s.wait_minutes+' min timer');
    line.appendChild(start);
  } else {
    line.appendChild(el('button',{class:'btn sm sub', onclick:()=>{ delete t['timerEnd_'+s.order]; queueSave('tests'); go('session',t.id); }},'Reset'));
  }
  wrap.appendChild(line);
  if(end){
    const tick=()=>{ const ms=end-Date.now(); if(ms<=0){ disp.textContent='Done — ready to continue'; disp.style.color='var(--good)'; return; }
      const m=Math.floor(ms/60000), ss=Math.floor((ms%60000)/1000); disp.textContent=`${m}:${String(ss).padStart(2,'0')}`; requestAnimationFrame?setTimeout(tick,1000):0; };
    tick();
  } else disp.textContent=s.wait_minutes+':00';
  return wrap;
}

async function retestFlow(t, step){
  // Minimal in-place retest: collect fresh readings via the strip, send back to Claude with plan-so-far.
  const strip=activeStrip();
  const v=$('#view'); v.innerHTML='';
  v.appendChild(el('button',{class:'btn sm sub', onclick:()=>go('session',t.id), style:'margin-bottom:10px'},'← Back to plan'));
  v.appendChild(el('div',{class:'card tight'},[ el('small',{html:'↻ <b>Retest</b> — enter current readings; Claude will adjust the remaining steps.'}) ]));
  const readings = strip.stripProfile.pads.map(p=>({name:p.name,unit:p.unit,value:null}));
  const form=el('div',{class:'card stack'});
  strip.stripProfile.pads.forEach((pad,i)=>{
    const chips=el('div',{class:'chips'});
    pad.chart.forEach(val=>{ const c=el('button',{class:'chip',type:'button'},String(val)); c.addEventListener('click',()=>{ readings[i].value=String(val); [...chips.children].forEach(x=>x.classList.remove('on')); c.classList.add('on'); }); chips.appendChild(c); });
    form.appendChild(el('div',{},[ el('label',{class:'fld'}, pad.name), chips ]));
  });
  v.appendChild(form);
  const err=el('div',{class:'err hidden'});
  v.appendChild(err);
  v.appendChild(el('button',{class:'btn', onclick:async(e)=>{
    const got=readings.filter(r=>r.value!=null); if(!got.length){ err.textContent='Enter at least one reading.'; err.classList.remove('hidden'); return; }
    e.target.disabled=true; e.target.innerHTML='<span class="spin"></span> Updating plan…';
    try{
      const did=(t.completedSteps||[]).map(c=>`${c.status==='done'?'did':'skipped'} step ${c.order} (${c.action})`).join('; ')||'none yet';
      const msg = `Retest after circulating. New readings: ${got.map(r=>r.name+' '+r.value).join(', ')}. Steps completed so far: ${did}. Adjust the remaining steps or add passes. Respond with ONLY the same JSON object shape.`;
      const convo=[...(t.conversation||[{role:'user',content:buildUserContent(t)}]), {role:'user',content:msg}];
      const result = await generatePlan(t, convo);
      t.retest = { timestamp:nowISO(), readings:got, plan:result.plan||null, raw:result.raw||null };
      if(result.messages) t.conversation=result.messages;
      queueSave('tests'); go('session',t.id);
    }catch(err2){ e.target.disabled=false; e.target.innerHTML='Update plan'; const er=$('.err'); er.textContent='Retest failed: '+err2.message; er.classList.remove('hidden'); }
  }},'Submit retest'));
}

/* ---- swipe-left-to-delete row ---- */
function swipeRow(fgNode, onDelete){
  const wrap=el('div',{class:'swipe'});
  const del=el('button',{class:'swipe-del', type:'button'},'Delete');
  const fg=el('div',{class:'swipe-fg'},[fgNode]);
  wrap.appendChild(del); wrap.appendChild(fg);
  let startX=0,startY=0,dx=0,open=false,dragging=false,axis=null,moved=false;
  fg.addEventListener('touchstart',(e)=>{ const t=e.touches[0]; startX=t.clientX; startY=t.clientY; dragging=true; axis=null; moved=false; fg.style.transition='none'; },{passive:true});
  fg.addEventListener('touchmove',(e)=>{ if(!dragging) return; const t=e.touches[0]; const mx=t.clientX-startX, my=t.clientY-startY;
    if(!axis){ if(Math.abs(mx)>Math.abs(my)+6) axis='h'; else if(Math.abs(my)>8) axis='v'; }
    if(axis==='h'){ e.preventDefault(); moved=true; dx=Math.max(-104, Math.min(0, mx+(open?-92:0))); fg.style.transform='translateX('+dx+'px)'; }
  },{passive:false});
  const settle=()=>{ if(!dragging) return; dragging=false; fg.style.transition='transform .18s'; open = dx < -46; fg.style.transform='translateX('+(open?-92:0)+'px)'; };
  fg.addEventListener('touchend',settle); fg.addEventListener('touchcancel',settle);
  // swallow the tap that follows a swipe (so swiping a log row doesn't also open it)
  fg.addEventListener('click',(e)=>{ if(moved||open){ e.stopPropagation(); e.preventDefault(); moved=false; } }, true);
  del.addEventListener('click',()=>{ if(confirm('Delete this entry?')) onDelete(); else { open=false; fg.style.transition='transform .18s'; fg.style.transform='translateX(0)'; } });
  return wrap;
}

/* ---- re-sync everything from OneDrive (pull-to-refresh) ---- */
async function reloadData(){
  await flushQueue(); // push any local edits first so a refresh can't clobber them
  for(const key of ['settings','products','tests','soaks','maintenance','events']){
    try{ const f=await readFile(FILES[key]); if(!f.missing) state[key]=JSON.parse(f.text); }catch(e){ console.warn('reload',key,e); }
  }
  try{ const r=await readFile(FILES.rules); if(!r.missing) state.rules=r.text; }catch(e){}
  const mir={}; for(const k in state) mir[k]=state[k]; mirrorSave(mir); setSync('ok');
}
function initPullToRefresh(){
  const ptr=$('#ptr'); if(!ptr) return; const ring=ptr.querySelector('.ring');
  let startY=0, pulling=false, dist=0; const THRESH=70;
  addEventListener('touchstart',(e)=>{ if(scrollY>0){ pulling=false; return; } startY=e.touches[0].clientY; pulling=true; dist=0; },{passive:true});
  addEventListener('touchmove',(e)=>{ if(!pulling) return; dist=e.touches[0].clientY-startY;
    if(dist>0 && scrollY<=0){ const d=Math.min(dist,120); ptr.style.opacity=Math.min(1,d/THRESH); ptr.style.transform='translateY('+(d*0.4)+'px)'; ring.textContent = d>=THRESH?'Release to refresh':'Pull to refresh'; }
    else ptr.style.opacity=0;
  },{passive:true});
  addEventListener('touchend',async ()=>{ if(!pulling) return; pulling=false;
    if(dist>=THRESH){ ring.textContent='Refreshing…'; ptr.style.opacity='1'; ptr.style.transform='translateY(28px)';
      try{ await reloadData(); render(); toast('Refreshed'); }catch(e){ toast('Refresh failed'); } }
    ptr.style.opacity='0'; ptr.style.transform='translateY(0)';
  },{passive:true});
}
